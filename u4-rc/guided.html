<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פעילות מודרכת: רשתות LP ו-HP ברמת בגרות (יחידה U4)</title>
  <link rel="icon" href="guided/img/favicon.png">
  <link rel="stylesheet" href="guided/guided.css">
  <script defer src="engine.js"></script>
  <script defer src="visuals.js"></script>
  <script defer src="guided/config.js"></script>
  <script defer src="guided/content.js"></script>
  <script defer src="guided/guided.js"></script>
</head>
<body data-view="welcome">
  <header class="topbar">
    <div class="topbar-in">
      <button class="brand" data-act="home" title="לדף הפתיחה">
        <span class="brand-mark" dir="ltr">RC</span>
        <span class="brand-text">פעילות מודרכת · <bdi dir="ltr">LP</bdi> ו-<bdi dir="ltr">HP</bdi></span>
      </button>
      <nav class="route" id="route" aria-label="התחנות"></nav>
      <div class="topbar-end">
        <span class="sync" id="sync"></span>
        <span class="score" id="hdr-score"></span>
        <button class="btn sheet-btn" data-act="formulas">📄 דף נוסחאות</button>
        <span class="who" id="hdr-name"></span>
      </div>
    </div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </header>

  <main>
    <section id="welcome" class="view view-welcome"></section>

    <section class="view view-station">
      <div class="stage">
        <div class="col-steps" id="steps-col"></div>
        <aside class="sim-panel" id="sim-panel" aria-label="הסימולטור">
          <div class="sim-head">
            <span class="sim-title">הסימולטור</span>
            <span class="sim-mode" id="sim-mode"></span>
          </div>
          <div class="canvas-wrap"><canvas id="sim-circuit"></canvas></div>
          <div class="sim-controls">
            <button class="btn primary" id="sim-play">▶ הפעל</button>
            <label class="t-box" dir="ltr">t = <input id="sim-t" type="number" inputmode="decimal"> <span id="sim-tunit">ms</span></label>
          </div>
          <div class="canvas-wrap"><canvas id="sim-scope"></canvas></div>
          <input class="sim-slider" id="sim-slider" type="range" min="0" max="1000" value="0" dir="ltr" aria-label="הזזת הסמן על ציר הזמן">
          <div class="sim-readouts" id="sim-readouts" dir="ltr"></div>
          <p class="sim-note" id="sim-note"></p>
        </aside>
      </div>
    </section>

    <section id="final" class="view view-final"></section>
  </main>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="דף נוסחאות">
    <div class="sheet-card">
      <div class="sheet-head"><h2>דף נוסחאות: רשתות <bdi dir="ltr">LP</bdi> ו-<bdi dir="ltr">HP</bdi></h2><button class="btn ghost" data-act="close-sheet">סגירה ✕</button></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <footer class="foot">מגמת הנדסת אלקטרוניקה ומחשבים · כיתה י"א · הסימולטור: מעבדת <bdi dir="ltr">RC</bdi> של יחידה <bdi dir="ltr">U4</bdi></footer>
</body>
</html>
